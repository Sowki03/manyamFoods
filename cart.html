<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Manyam Foods</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --green: #76e037;
            --orange: #c85a3a;
            --dark: #1a1a1a;
            --gray: #666;
            --border: #e8f0e5;
            --card-bg: #f9fdf7;
            --footer-bg: #151e13;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f5f9f3; color: var(--dark); min-height: 100vh; }

        /* NAVBAR */
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 6%; background: white; position: sticky; top: 0; z-index: 1000;
            box-shadow: 0 2px 20px rgba(0,0,0,0.07);
        }
        .logo { font-weight: 800; font-size: 1.25rem; color: var(--dark); display: flex; align-items: center; gap: 8px; text-decoration: none; }
        .logo-icon { width: 20px; height: 20px; background: var(--green); border-radius: 4px; flex-shrink: 0; }
        .nav-links { display: flex; list-style: none; gap: 26px; }
        .nav-links a { text-decoration: none; color: var(--dark); font-size: 0.88rem; font-weight: 500; }
        .nav-right { display: flex; align-items: center; gap: 12px; }
        .btn-back { background: var(--card-bg); padding: 9px 18px; border-radius: 50px; text-decoration: none; color: var(--dark); font-weight: 600; font-size: 0.85rem; border: 1.5px solid var(--border); display: flex; align-items: center; gap: 6px; }
        .btn-back svg { width: 14px; height: 14px; }
        .cart-icon {
            position: relative; width: 42px; height: 42px; border-radius: 50%;
            border: 2px solid var(--green); display: flex; align-items: center; justify-content: center;
            text-decoration: none; color: var(--dark); background: #f0fdf4;
        }
        .cart-icon svg { width: 18px; height: 18px; }
        .cart-badge {
            position: absolute; top: -5px; right: -5px; background: var(--orange); color: white;
            font-size: 0.62rem; font-weight: 800; min-width: 18px; height: 18px; border-radius: 50%;
            display: none; align-items: center; justify-content: center; border: 2px solid white;
        }
        .cart-badge.show { display: flex; }
        .hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; background: none; border: none; padding: 4px; }
        .hamburger span { display: block; width: 22px; height: 2px; background: var(--dark); border-radius: 2px; }

        /* MOBILE NAV */
        .mobile-nav {
            display: none; position: fixed; inset: 0; background: white; z-index: 999;
            flex-direction: column; align-items: center; justify-content: center; gap: 30px;
            transform: translateX(100%); transition: transform 0.3s;
        }
        .mobile-nav.open { transform: translateX(0); }
        .mobile-nav a { font-size: 1.4rem; font-weight: 800; text-decoration: none; color: var(--dark); }
        .mobile-nav .close-btn { position: absolute; top: 20px; right: 22px; font-size: 1.8rem; background: none; border: none; cursor: pointer; }

        /* PAGE HEADER */
        .page-header { background: white; padding: 28px 6% 22px; border-bottom: 1px solid var(--border); }
        .breadcrumb { font-size: 0.78rem; color: #aaa; margin-bottom: 8px; }
        .breadcrumb a { color: #aaa; text-decoration: none; }
        .breadcrumb a:hover { color: var(--green); }
        .page-header h1 { font-size: 1.7rem; font-weight: 800; display: flex; align-items: center; gap: 10px; }
        .item-count { font-size: 0.85rem; font-weight: 600; color: var(--gray); background: var(--card-bg); padding: 3px 10px; border-radius: 50px; border: 1px solid var(--border); }

        /* CART LAYOUT */
        .cart-wrapper { max-width: 1200px; margin: 0 auto; padding: 30px 6%; display: grid; grid-template-columns: 1fr 360px; gap: 28px; align-items: start; }

        /* CART ITEMS */
        .cart-items { display: flex; flex-direction: column; gap: 14px; }
        .cart-item {
            background: white; border-radius: 16px; border: 1.5px solid var(--border);
            padding: 18px; display: flex; gap: 16px; align-items: center;
            transition: box-shadow 0.2s;
        }
        .cart-item:hover { box-shadow: 0 6px 20px rgba(0,0,0,0.06); }
        .item-img { width: 80px; height: 80px; border-radius: 12px; object-fit: cover; flex-shrink: 0; background: var(--card-bg); }
        .item-details { flex: 1; }
        .item-name { font-size: 0.95rem; font-weight: 700; margin-bottom: 3px; }
        .item-variant { font-size: 0.78rem; color: var(--gray); margin-bottom: 10px; }
        .item-bottom { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
        .item-unit-price { font-size: 0.8rem; color: var(--gray); }
        .item-total { font-size: 1.05rem; font-weight: 800; color: var(--orange); }
        .item-qty { display: flex; align-items: center; border: 1.5px solid var(--border); border-radius: 9px; overflow: hidden; }
        .iq-btn { width: 30px; height: 30px; background: none; border: none; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background 0.15s; }
        .iq-btn:hover { background: var(--card-bg); }
        .iq-num { width: 32px; text-align: center; font-size: 0.85rem; font-weight: 700; border: none; border-left: 1.5px solid var(--border); border-right: 1.5px solid var(--border); background: none; outline: none; font-family: 'Inter', sans-serif; }
        .remove-btn { background: none; border: none; cursor: pointer; color: #ccc; transition: color 0.2s; padding: 6px; border-radius: 8px; flex-shrink: 0; }
        .remove-btn:hover { color: var(--orange); background: #fff5f3; }
        .remove-btn svg { width: 16px; height: 16px; }

        /* EMPTY STATE */
        .empty-cart { text-align: center; padding: 80px 20px; background: white; border-radius: 20px; border: 1.5px solid var(--border); }
        .empty-icon { font-size: 4rem; margin-bottom: 16px; }
        .empty-cart h3 { font-size: 1.2rem; font-weight: 700; margin-bottom: 8px; }
        .empty-cart p { color: var(--gray); font-size: 0.9rem; margin-bottom: 24px; }
        .btn-shop-now { background: var(--green); padding: 12px 28px; border-radius: 50px; text-decoration: none; color: black; font-weight: 700; font-size: 0.9rem; display: inline-block; }

        /* ORDER SUMMARY */
        .order-summary { background: white; border-radius: 20px; border: 1.5px solid var(--border); padding: 26px; position: sticky; top: 90px; }
        .summary-title { font-size: 1.1rem; font-weight: 800; margin-bottom: 22px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
        .summary-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 13px; font-size: 0.88rem; }
        .summary-row .label { color: var(--gray); }
        .summary-row .val { font-weight: 600; }
        .summary-row.free .val { color: #22c55e; font-weight: 700; }
        .summary-divider { height: 1px; background: var(--border); margin: 16px 0; }
        .summary-total { display: flex; justify-content: space-between; align-items: center; font-size: 1.1rem; font-weight: 800; }
        .summary-total .total-val { color: var(--orange); }

        /* COUPON */
        .coupon-row { display: flex; gap: 8px; margin: 18px 0; }
        .coupon-input {
            flex: 1; padding: 9px 14px; border-radius: 10px; border: 1.5px solid var(--border);
            font-size: 0.82rem; font-family: 'Inter', sans-serif; outline: none;
            transition: border-color 0.2s;
        }
        .coupon-input:focus { border-color: var(--green); }
        .btn-apply { background: var(--card-bg); border: 1.5px solid var(--border); padding: 9px 16px; border-radius: 10px; font-size: 0.82rem; font-weight: 700; cursor: pointer; font-family: 'Inter', sans-serif; white-space: nowrap; }
        .btn-apply:hover { border-color: var(--green); }
        .coupon-msg { font-size: 0.78rem; color: #22c55e; font-weight: 600; min-height: 18px; }

        /* CHECKOUT BTN */
        .btn-checkout {
            width: 100%; background: var(--dark); color: white; border: none;
            padding: 15px; border-radius: 14px; font-size: 0.95rem; font-weight: 700;
            cursor: pointer; transition: background 0.2s, transform 0.15s;
            font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px;
            margin-top: 18px;
        }
        .btn-checkout:hover { background: #333; transform: translateY(-1px); }
        .btn-checkout:disabled { background: #ccc; cursor: not-allowed; transform: none; }
        .btn-checkout svg { width: 16px; height: 16px; }

        .btn-whatsapp {
            width: 100%; background: #25D366; color: white; border: none;
            padding: 14px; border-radius: 14px; font-size: 0.9rem; font-weight: 700;
            cursor: pointer; transition: background 0.2s, transform 0.15s;
            font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px;
            margin-top: 10px; text-decoration: none;
        }
        .btn-whatsapp:hover { background: #20ba5a; transform: translateY(-1px); }
        .wa-icon { width: 18px; height: 18px; }

        .secure-note { text-align: center; font-size: 0.74rem; color: #aaa; margin-top: 14px; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .secure-note svg { width: 12px; height: 12px; }

        /* SIGN-IN + DELIVERY DETAILS */
        .section-title { font-size: 1rem; font-weight: 800; margin: 22px 0 14px; padding-top: 18px; border-top: 1px solid var(--border); }
        .signin-box { background: var(--card-bg); border: 1.5px solid var(--border); border-radius: 14px; padding: 16px; text-align: center; }
        .signin-box p { font-size: 0.82rem; color: var(--gray); margin-bottom: 12px; }
        .btn-google {
            width: 100%; background: white; border: 1.5px solid #dadce0; border-radius: 12px; padding: 11px;
            font-size: 0.88rem; font-weight: 600; font-family: 'Inter', sans-serif; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px; color: #3c4043;
        }
        .btn-google:hover { background: #f8faff; border-color: #c6d4f5; }
        .btn-google svg { width: 18px; height: 18px; }
        .signed-as { font-size: 0.78rem; color: var(--gray); margin-bottom: 12px; overflow-wrap: anywhere; }
        .signed-as a { color: var(--orange); font-weight: 600; text-decoration: none; }
        .details-form { display: flex; flex-direction: column; gap: 10px; }
        .details-form .coupon-input { width: 100%; }
        .details-form textarea { height: 80px; padding: 10px 14px; resize: none; }
        .checkout-err { color: var(--orange); font-size: 0.8rem; font-weight: 600; margin-top: 12px; }
        .checkout-err:empty { display: none; }
        .btn-whatsapp:disabled, .btn-checkout:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

        /* ORDER PLACED */
        .success-card { grid-column: 1 / -1; background: white; border: 1.5px solid var(--border); border-radius: 20px; padding: 44px 24px; text-align: center; max-width: 560px; margin: 0 auto; width: 100%; }
        .success-icon { width: 64px; height: 64px; border-radius: 50%; background: #f0fdf4; color: #22c55e; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-size: 2rem; }
        .success-card h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 6px; }
        .success-card .order-no { font-size: 0.9rem; color: var(--gray); margin-bottom: 14px; }
        .success-card .order-no strong { color: var(--dark); }
        .success-card .note { font-size: 0.85rem; color: var(--gray); line-height: 1.6; margin-bottom: 22px; }
        .success-actions { display: flex; flex-direction: column; gap: 10px; max-width: 320px; margin: 0 auto; }
        .btn-outline { display: block; padding: 13px; border-radius: 14px; border: 1.5px solid var(--border); text-decoration: none; color: var(--dark); font-weight: 700; font-size: 0.9rem; }
        .btn-outline:hover { border-color: var(--green); }

        /* FOOTER */
        footer { background: var(--footer-bg); color: white; padding: 44px 6% 26px; margin-top: 40px; }
        .f-logo { font-weight: 800; font-size: 1.2rem; display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
        .f-desc { color: #a0a89f; font-size: 0.88rem; line-height: 1.6; max-width: 320px; }
        .f-bottom { margin-top: 28px; padding-top: 24px; border-top: 1px solid rgba(255,255,255,0.08); display: flex; justify-content: space-between; align-items: center; font-size: 0.78rem; color: #666; flex-wrap: wrap; gap: 10px; }
        .f-bottom a { color: #666; text-decoration: none; margin-left: 14px; }

        /* RESPONSIVE */
        @media (max-width: 900px) {
            .cart-wrapper { grid-template-columns: 1fr; }
            .order-summary { position: static; }
        }
        @media (max-width: 768px) {
            .nav-links { display: none; }
            .hamburger { display: flex; }
            .mobile-nav { display: flex; }
            .btn-back span { display: none; }
            .cart-wrapper { padding: 18px 4%; }
            .item-img { width: 64px; height: 64px; }
        }
        @media (max-width: 480px) {
            .item-bottom { flex-direction: column; align-items: flex-start; gap: 8px; }
        }
        .mf-page-head h1 .item-count { font-family: var(--sans); font-size: 0.85rem; vertical-align: middle; margin-left: 8px; }
        .cart-wrapper { padding-top: 10px; }
    </style>
    <link rel="stylesheet" href="css/site.css?v=3">
    <link rel="stylesheet" href="css/motion.css?v=3">
</head>
<body data-no-drawer>

<!-- PAGE HEADER -->
<div class="mf-page-head">
    <div class="mf-crumb"><a href="index.html">Home</a> / <a href="products.html">Shop</a> / Checkout</div>
    <h1>Checkout <span class="item-count" id="itemCountBadge">0 items</span></h1>
</div>

<!-- CART BODY -->
<div class="cart-wrapper" id="cartWrapper">
    <!-- Items -->
    <div id="cartContainer">
        <!-- Rendered by JS -->
    </div>

    <!-- Order Summary -->
    <div class="order-summary" id="summaryBox">
        <div class="summary-title">Order Summary</div>
        <div class="summary-row"><span class="label">Subtotal</span><span class="val" id="subtotal">₹0</span></div>
        <div class="summary-row free" id="discountRow" hidden><span class="label">Discount</span><span class="val" id="discountAmt">−₹0</span></div>
        <div class="summary-row" id="deliveryRow"><span class="label">Delivery</span><span class="val" id="delivery">—</span></div>
        <div class="summary-row"><span class="label">Items</span><span class="val" id="itemsCount">0</span></div>
        <div class="summary-divider"></div>
        <div class="summary-total"><span>Total</span><span class="total-val" id="totalAmt">₹0</span></div>

        <!-- Coupon -->
        <div class="coupon-row">
            <input type="text" class="coupon-input" id="couponInput" placeholder="Coupon code">
            <button class="btn-apply" onclick="applyCoupon()">Apply</button>
        </div>
        <div class="coupon-msg" id="couponMsg"></div>

        <!-- Delivery details -->
        <div class="section-title">Delivery Details</div>
        <div class="signin-box" id="signedOutBox" hidden>
            <p>Sign in to place your order and track it anytime.</p>
            <button class="btn-google" onclick="signInWithGoogle('cart.html')">
                <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
                Sign in with Google
            </button>
        </div>
        <div id="signedInBox" hidden>
            <div class="signed-as">Signed in as <strong id="signedEmail"></strong> · <a href="#" onclick="signOut(); return false;">Sign out</a></div>
            <div class="details-form">
                <input type="text" id="custName" class="coupon-input" placeholder="Full Name" autocomplete="name">
                <input type="tel" id="custPhone" class="coupon-input" placeholder="Mobile Number (10 digits)" autocomplete="tel" inputmode="tel" maxlength="14">
                <textarea id="custAddress" class="coupon-input" placeholder="Complete Delivery Address (House No, Street, City, Pincode)" autocomplete="street-address"></textarea>
            </div>
        </div>

        <div class="checkout-err" id="checkoutErr"></div>

        <!-- Checkout -->
        <button class="btn-checkout" id="checkoutBtn" onclick="placeOrder('UPI')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM18 18h3v3h-3z"/></svg>
            Pay with UPI
        </button>
        <button class="btn-whatsapp" id="payLaterBtn" onclick="placeOrder('PAY_LATER')">
            Place Order, Pay Later
        </button>
        <p class="secure-note">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
            Prices are confirmed by our store at checkout
        </p>
    </div>
</div>

<script>
const FALLBACK_WA_NUMBER = "917207021603";

let quote = null;          // latest server-calculated totals
let appliedCoupon = '';
let quoteSeq = 0;
let session = null;

function setErr(msg){ document.getElementById('checkoutErr').textContent = msg || ''; }
function cartPayload(){ return getCart().map(i => ({ variant_id: i.variant_id, qty: i.qty })); }

function renderItems(){
    const cart = getCart();
    const container = document.getElementById('cartContainer');
    const totalItems = cart.reduce((s,i)=>s+i.qty, 0);
    refreshBadge();
    document.getElementById('itemCountBadge').textContent = totalItems + ' item' + (totalItems!==1?'s':'');

    if(cart.length === 0){
        container.innerHTML = `
            <div class="empty-cart">
                <div class="empty-icon">🛒</div>
                <h3>Your cart is empty</h3>
                <p>Looks like you haven't added anything yet.<br>Explore our handcrafted collection!</p>
                <a href="products.html" class="btn-shop-now">Browse Products</a>
            </div>`;
        return;
    }

    container.innerHTML = `<div class="cart-items">${cart.map((item,idx) => `
        <div class="cart-item">
            <img class="item-img" src="${esc(item.img)}" alt="${esc(item.name)}" onerror="this.style.visibility='hidden'">
            <div class="item-details">
                <div class="item-name">${esc(item.name)}</div>
                <div class="item-variant">${esc(item.variant)}</div>
                <div class="item-bottom">
                    <div class="item-qty">
                        <button class="iq-btn" onclick="changeCartQty(${idx}, -1)">−</button>
                        <input class="iq-num" value="${item.qty}" readonly>
                        <button class="iq-btn" onclick="changeCartQty(${idx}, 1)">+</button>
                    </div>
                    <div>
                        <div class="item-unit-price">${rupees(item.price)} each</div>
                        <div class="item-total">${rupees(item.price * item.qty)}</div>
                    </div>
                </div>
            </div>
            <button class="remove-btn" onclick="removeItem(${idx})" title="Remove">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
            </button>
        </div>`).join('')}
    </div>
    <button onclick="clearCart()" style="margin-top:14px;background:none;border:none;color:#ccc;font-size:0.8rem;cursor:pointer;font-family:Inter,sans-serif;font-weight:600;display:flex;align-items:center;gap:5px;padding:8px 0;transition:color 0.2s;" onmouseover="this.style.color='#c85a3a'" onmouseout="this.style.color='#ccc'">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>
        Clear all items
    </button>`;
}

function updateSummary(){
    const cart = getCart();
    const localSub = cart.reduce((s,i)=>s+(i.price*i.qty), 0);
    const q = quote;
    document.getElementById('subtotal').textContent = rupees(q ? q.subtotal : localSub);
    document.getElementById('discountRow').hidden = !(q && q.discount > 0);
    if(q) document.getElementById('discountAmt').textContent = '−' + rupees(q.discount);
    const del = document.getElementById('delivery');
    const delRow = document.getElementById('deliveryRow');
    if(q){ del.textContent = q.delivery_fee > 0 ? rupees(q.delivery_fee) : 'FREE'; delRow.classList.toggle('free', q.delivery_fee === 0); }
    else { del.textContent = '—'; delRow.classList.remove('free'); }
    document.getElementById('itemsCount').textContent = cart.reduce((s,i)=>s+i.qty, 0);
    document.getElementById('totalAmt').textContent = rupees(q ? q.total : localSub);

    const canOrder = cart.length > 0 && !!q;
    document.getElementById('checkoutBtn').disabled = !canOrder;
    document.getElementById('payLaterBtn').disabled = !canOrder;
}

async function refreshQuote(){
    const cart = getCart();
    const seq = ++quoteSeq;
    if(!cart.length){ quote = null; setErr(''); updateSummary(); return; }
    if(!sb){ quote = null; setErr(NOT_CONNECTED_MSG); updateSummary(); return; }

    const { data, error } = await sb.rpc('quote_order', { p_items: cartPayload(), p_coupon: appliedCoupon || null });
    if(seq !== quoteSeq) return; // a newer request is running
    if(error){ quote = null; setErr(errMsg(error)); updateSummary(); return; }

    quote = data;
    setErr('');

    // Keep the prices shown in the cart in sync with the store's prices
    let changed = false;
    const c = getCart();
    c.forEach(i => {
        const line = data.lines.find(l => l.variant_id === i.variant_id);
        if(line && line.unit_price !== i.price){ i.price = line.unit_price; changed = true; }
    });
    if(changed){ saveCart(c); renderItems(); }

    const msg = document.getElementById('couponMsg');
    if(appliedCoupon){
        if(data.coupon_code){ msg.textContent = '✓ ' + data.coupon_code + ' applied! You save ' + rupees(data.discount); msg.style.color = '#22c55e'; }
        else { msg.textContent = '✗ ' + (data.coupon_message || 'Invalid coupon code'); msg.style.color = '#c85a3a'; appliedCoupon = ''; }
    }
    updateSummary();
}

function changeCartQty(idx, d){
    const cart = getCart();
    cart[idx].qty = Math.max(1, Math.min(99, cart[idx].qty + d));
    saveCart(cart); renderItems(); updateSummary(); refreshQuote();
}

function removeItem(idx){
    const cart = getCart();
    cart.splice(idx, 1);
    saveCart(cart); renderItems(); updateSummary(); refreshQuote();
}

function clearCart(){
    if(confirm('Remove all items from cart?')){ clearCartStorage(); renderItems(); refreshQuote(); }
}

function applyCoupon(){
    appliedCoupon = document.getElementById('couponInput').value.trim().toUpperCase();
    if(!appliedCoupon) document.getElementById('couponMsg').textContent = '';
    refreshQuote();
}

// ── Sign-in state ──
async function renderSignIn(){
    document.getElementById('signedOutBox').hidden = !!session;
    document.getElementById('signedInBox').hidden = !session;
    if(!session) return;
    document.getElementById('signedEmail').textContent = session.user.email;

    const nameEl = document.getElementById('custName');
    const phoneEl = document.getElementById('custPhone');
    const addrEl = document.getElementById('custAddress');
    const { data: prof } = await sb.from('profiles').select('full_name,phone,address').eq('id', session.user.id).maybeSingle();
    const meta = session.user.user_metadata || {};
    if(!nameEl.value) nameEl.value = (prof && prof.full_name) || meta.full_name || meta.name || '';
    if(!phoneEl.value && prof) phoneEl.value = prof.phone || '';
    if(!addrEl.value && prof) addrEl.value = prof.address || '';
}

function normalizePhone(p){
    let d = p.replace(/\D/g, '');
    if(d.length === 12 && d.startsWith('91')) d = d.slice(2);
    return d;
}

// ── Place order ──
async function placeOrder(method){
    if(!getCart().length) return;
    if(!sb){ setErr(NOT_CONNECTED_MSG); return; }
    if(!session){ signInWithGoogle('cart.html'); return; }
    if(!quote){ setErr('Calculating your total, please try again in a moment.'); refreshQuote(); return; }

    const name = document.getElementById('custName').value.trim();
    const phone = normalizePhone(document.getElementById('custPhone').value);
    const address = document.getElementById('custAddress').value.trim();
    if(name.length < 2){ setErr('Please enter your full name.'); return; }
    if(!/^[6-9]\d{9}$/.test(phone)){ setErr('Please enter a valid 10-digit mobile number.'); return; }
    if(address.length < 10){ setErr('Please enter your complete delivery address.'); return; }
    setErr('');

    const btns = [document.getElementById('checkoutBtn'), document.getElementById('payLaterBtn')];
    btns.forEach(b => b.disabled = true);
    const { data, error } = await sb.rpc('place_order', {
        p_items: cartPayload(),
        p_coupon: appliedCoupon || null,
        p_name: name,
        p_phone: phone,
        p_address: address,
        p_payment_method: method,
        p_expected_total: quote.total
    });
    btns.forEach(b => b.disabled = false);

    if(error){ setErr(errMsg(error)); refreshQuote(); return; }

    clearCartStorage();
    refreshBadge();
    const order = { ...data, name, phone, address };

    if(method === 'UPI'){
        showSuccess(order, 'UPI', null); // page behind the popup
        openUpiPay({
            orderNo: data.order_no,
            amount: data.total,
            onPaid: (utr) => showSuccess(order, 'UPI', utr)
        });
    } else {
        showSuccess(order, 'PAY_LATER', null);
    }
}

function whatsappText(order, method, utr){
    const items = order.lines.map(l => ` - ${l.product_name} (${l.variant_label}) x ${l.qty} = Rs.${l.line_total}`).join('\n');
    let pay;
    if(method === 'UPI') pay = utr ? `Payment: UPI, UTR ${utr}` : 'Payment: UPI (not paid yet)';
    else pay = 'Payment: Pay later (please share payment details)';
    return `*NEW ORDER ${order.order_no} - MANYAM FOODS*
--------------------------
Name: ${order.name}
Phone: ${order.phone}
Address: ${order.address}

Items:
${items}

Subtotal: Rs.${order.subtotal}${order.discount > 0 ? '\nDiscount: -Rs.' + order.discount : ''}
Delivery: ${order.delivery_fee > 0 ? 'Rs.' + order.delivery_fee : 'FREE'}
*Total: Rs.${order.total}*
${pay}`;
}

async function showSuccess(order, method, utr){
    let wa = FALLBACK_WA_NUMBER;
    try { wa = (await getSettings()).whatsapp_number || wa; } catch(e){}
    const waUrl = 'https://wa.me/' + wa + '?text=' + encodeURIComponent(whatsappText(order, method, utr));

    let title, note;
    if(method === 'UPI' && utr){
        title = 'Payment submitted!';
        note = `We'll verify your UPI payment (UTR ${esc(utr)}) and confirm your order shortly. You can track it anytime in My Orders.`;
    } else if(method === 'UPI'){
        title = 'Order saved, payment pending';
        note = `Your order is reserved. Finish the UPI payment from <strong>My Orders → Pay now</strong> so we can ship it.`;
    } else {
        title = 'Order placed!';
        note = `We'll contact you on WhatsApp with payment details. You can track your order anytime in My Orders.`;
    }

    document.getElementById('cartWrapper').innerHTML = `
        <div class="success-card">
            <div class="success-icon">✓</div>
            <h2>${title}</h2>
            <div class="order-no">Order <strong>${esc(order.order_no)}</strong> · ${rupees(order.total)}</div>
            <p class="note">${note}</p>
            <div class="success-actions">
                <a class="btn-whatsapp" href="${waUrl}" target="_blank" rel="noopener">Send Order Details on WhatsApp</a>
                <a class="btn-outline" href="orders.html">Track in My Orders</a>
            </div>
        </div>`;
    document.getElementById('itemCountBadge').textContent = '0 items';
    window.scrollTo({ top: 0, behavior: 'smooth' });
}


// Init
renderItems();
updateSummary();
refreshQuote();
(async () => {
    session = await getSession();
    renderSignIn();
    if(sb) sb.auth.onAuthStateChange((_e, s) => { session = s; renderSignIn(); });
})();
</script>
